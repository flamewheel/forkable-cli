name: Publish to npm

# Publishes the package to npm whenever you push a version tag like v0.1.0.
# Release flow:
#   1. bump "version" in package.json (e.g. 0.1.0 -> 0.1.1)
#   2. commit it
#   3. git tag v0.1.1 && git push --tags
# Pushing the tag triggers this workflow, which publishes that version.
#
# One-time setup: add an npm "automation" access token as a repo secret named NPM_TOKEN
# (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # enables npm provenance (supply-chain attestation)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json first."
            exit 1
          fi

      - run: npm ci

      # If provenance ever causes a failure, drop the --provenance flag.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
