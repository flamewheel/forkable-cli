name: Publish to npm

# Publishes to npm whenever you push a version tag like v0.1.0, using npm
# Trusted Publishing (OIDC) — no stored token, nothing to rotate.
#
# Release flow:
#   1. bump "version" in package.json (e.g. 0.1.0 -> 0.1.1)
#   2. commit it
#   3. git tag v0.1.1 && git push --tags
#
# One-time setup on npm: on the forkable-cli package page -> Settings ->
# Trusted Publisher, add this GitHub repo + workflow (publish.yml).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; the bundled npm is older.
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json first."
            exit 1
          fi

      - run: npm ci

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC, and provenance is automatic.
      - run: npm publish
